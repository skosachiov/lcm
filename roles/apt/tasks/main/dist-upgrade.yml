- name: Remove outdated dist-upgrade fact file @remove_outdated_dist_upgrade_fact_file
  block:
    - name: Remove outdated dist-upgrade fact file Stat @remove_outdated_dist_upgrade_fact_file
      find:
        paths: /etc/ansible/facts.d/
        patterns: dist_upgrade.fact
        age: 30d
      register: result
    - name: Remove outdated dist-upgrade fact file File @remove_outdated_dist_upgrade_fact_file
      file:
        path: "{{item.path}}"
        state: absent
      with_items: "{{result.files}}"
  tags:
    - ws
    - remove_outdated_dist_upgrade_fact_file

- name: Switch to new kernel @switch_to_new_kernel
  block:
    - name: Switch to new kernel Apt
      failed_when: false
      apt:
        name: "{{var_switch_to_new_kernel}}"
        state: latest
    - name: Switch to new kernel Rm line
      lineinfile:
        dest: /etc/default/grub
        regexp: ^GRUB_DEFAULT=
        state: absent
      register: result
    - name: Switch to new kernel Update grub
      command: update-grub
      when: result.changed
  when: var_switch_to_new_kernel is defined
  tags:
    - ws
    - switch_to_new_kernel

- name: Apt dist-upgrade @apt_dist_upgrade
  ignore_errors: "{{ansible_check_mode}}"
  block:
    - name: Apt dist-upgrade Upgrade @apt_dist_upgrade
      apt:
        update_cache: true
        upgrade: dist
      when: var_dist_upgrade
    - name: Apt dist-upgrade Remove fact @apt_dist_upgrade
      file:
        path: /etc/ansible/facts.d/dist_upgrade.fact
        state: absent
  tags:
    - ws
    - apt_dist_upgrade
