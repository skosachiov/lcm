- name: Ensure packages are installed @packages_are_installed
  ansible.builtin.apt:
    name: '{{ var_apt_present | map("regex_replace", "\\s*\\(.*\\)$", "") | list }}'
    state: latest
    update_cache: true
  when: var_apt_present | default([]) | length > 0
  ignore_errors: true
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_are_installed

- name: Ensure unnecessary packages are removed @packages_are_removed
  ansible.builtin.apt:
    name: '{{ var_apt_absent | map("regex_replace", "\\s*\\(.*\\)$", "") | list }}'
    state: absent
  when: var_apt_absent | default([]) | length > 0
  ignore_errors: true
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_are_removed

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Check present packages versions against the new fact @packages_checker
  ansible.builtin.shell: |
    got="$(dpkg-query -W -f='${Version}' {{ item | regex_replace('\s*\(.*\)$','') }} 2>/dev/null || true)"
    want="{{ item }}"
    name="$(echo "$want" | sed -E 's/\s*\(.*\)$//')"
    op="$(echo "$want"   | sed -nE 's/.*\(\s*(>=|=|<<|<=|>>)\s*[^()\s]+\s*\).*/\1/p')"
    ver="$(echo "$want"  | sed -nE 's/.*\(\s*(>=|=|<<|<=|>>)\s*([^()\s]+)\s*\).*/\2/p')"
    if [ -z "$got" ]; then
      echo "MISSING|$name"
    elif [ -n "$op" ] && ! dpkg --compare-versions "$got" "$op" "$ver"; then
      echo "BAD_VER|$name|$got|$op$ver"
    else
      echo "OK|$name|$got"
    fi
  args: { executable: /bin/bash }
  loop: "{{ var_apt_present }}"
  register: _check
  changed_when: false
  when: ansible_facts.packages is defined
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_checker

- name: Show check results @packages_checker
  ansible.builtin.debug:
    msg:
      ok:      "{{ _check.results | map(attribute='stdout') | select('match','^OK')      | list }}"
      missing: "{{ _check.results | map(attribute='stdout') | select('match','^MISSING') | list }}"
      bad_ver: "{{ _check.results | map(attribute='stdout') | select('match','^BAD_VER') | list }}"
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_checker