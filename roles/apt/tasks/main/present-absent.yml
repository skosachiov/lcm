- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - always

- name: Evaluate version constraints for var_apt_present and var_apt_absent @packages_are_installed_op_map
  ansible.builtin.set_fact:
    _apt_op_map:
      '<<': '<'
      '<=': '<='
      '=': '=='
      '==': '=='
      '>=': '>='
      '>>': '>'
    _apt_present_filtered: []
    _apt_absent_filtered: []
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_are_installed_op_map

- name: Build filtered list of packages to install @packages_are_installed
  ansible.builtin.set_fact:
    _apt_present_filtered: "{{ _apt_present_filtered + [_pkg_name] }}"
  vars:
    _raw_parts: "{{ item | regex_search('^([^\\s(]+)(?:\\s*\\(\\s*(<<|<=|==|=|>=|>>)\\s*([^)\\s]+)\\s*\\))?$', '\\1', '\\2', '\\3') }}"
    _parts: "{{ _raw_parts | map('default', '', true) | list }}"
    _pkg_name: "{{ _parts[0] }}"
    _pkg_op: "{{ _parts[1] }}"
    _pkg_ver: "{{ _parts[2] }}"
    _installed_ver: "{{ ansible_facts.packages[_pkg_name][0].version if (_pkg_name in ansible_facts.packages) else '' }}"
  when: >-
    (_pkg_op == '') or
    (_installed_ver == '') or
    (_installed_ver is version(_pkg_ver, _apt_op_map.get(_pkg_op, '==')))
  loop: "{{ var_apt_present | default([]) }}"
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_are_installed

- name: Ensure packages are installed @packages_are_installed
  ansible.builtin.apt:
    name: "{{ _apt_present_filtered }}"
    state: latest
    update_cache: true
  when: _apt_present_filtered | length > 0
  ignore_errors: true
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_are_installed

- name: Build filtered list of packages to remove @packages_are_removed
  ansible.builtin.set_fact:
    _apt_absent_filtered: "{{ _apt_absent_filtered + [_pkg_name] }}"
  vars:
    _raw_parts: "{{ item | regex_search('^([^\\s(]+)(?:\\s*\\(\\s*(<<|<=|==|=|>=|>>)\\s*([^)\\s]+)\\s*\\))?$', '\\1', '\\2', '\\3') }}"
    _parts: "{{ _raw_parts | map('default', '', true) | list }}"
    _pkg_name: "{{ _parts[0] }}"
    _pkg_op: "{{ _parts[1] }}"
    _pkg_ver: "{{ _parts[2] }}"
    _installed_ver: "{{ ansible_facts.packages[_pkg_name][0].version if (_pkg_name in ansible_facts.packages) else '' }}"
  when:
    - _pkg_name in ansible_facts.packages
    - (_pkg_op == '') or (_installed_ver is version(_pkg_ver, _apt_op_map.get(_pkg_op, '==')))
  loop: "{{ var_apt_absent | default([]) }}"
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_are_removed

- name: Ensure unnecessary packages are removed @packages_are_removed
  ansible.builtin.apt:
    name: "{{ _apt_absent_filtered }}"
    state: absent
  when: _apt_absent_filtered | length > 0
  ignore_errors: true
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_are_removed

# Check initial list

- name: Read initial package list @read_initial_packages_list
  ansible.builtin.slurp:
    src: "{{playbook_dir}}/inventories/devices/{{var_device}}/files/apt/initial.list"
  register: initial_list_raw
  failed_when: false
  check_mode: false
  tags:
    - bl
    - ws
    - sec
    - mob
    - read_initial_packages_list

- name: Compare installed packages against initial.list @compare_with_initial_packages_list
  when: initial_list_raw.content is defined
  block:
    - name: Compute missing and unwanted packages
      ansible.builtin.set_fact:
        initial_packages: >-
          {{
            (initial_list_raw.content | b64decode).splitlines()
            | map('trim')
            | reject('match', '^#')
            | reject('equalto', '')
            | list
          }}
        installed_packages: "{{ ansible_facts.packages.keys() | list }}"

    - name: Determine missing and unwanted packages @compare_with_initial_packages_list
      ansible.builtin.set_fact:
        missing_packages: "{{ initial_packages | difference(installed_packages) | sort }}"
        unwanted_packages: "{{ installed_packages | difference(initial_packages) | sort }}"

    - name: Report package drift and set changed flag @compare_with_initial_packages_list
      ansible.builtin.debug:
        msg:
          - "Missing packages ({{ missing_packages | length }}): {{ missing_packages }}"
          - "Unwanted packages ({{ unwanted_packages | length }}): {{ unwanted_packages }}"
      changed_when: >-
        (missing_packages | length > 0) or (unwanted_packages | length > 0)
  tags:
    - bl
    - ws
    - sec
    - mob
    - compare_with_initial_packages_list