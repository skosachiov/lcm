# Install packages

- name: Validate APT package versions @packages_are_installed
  ansible.builtin.assert:
    that:
      - >-
        (
          var_apt_present
          | select('search', '\(\s*(<<|<=|>>)\s*')
          | list | length
        ) == 0
    fail_msg: >-
      APT module does not support <<, <= or >> version constraints.
      Use APT pinning for these packages.
  tags:
    - ws
    - packages_are_installed

- name: Ensure packages are installed @packages_are_installed
  ansible.builtin.apt:
    name: >-
      {{
        var_apt_present
        | map(
            'regex_replace',
            '^(\S+)\s*\(\s*(>=|=)\s*([^()\s]+)\s*\)$',
            '\1\2\3'
          )
        | list
      }}
    state: latest
  when: var_apt_present | default([]) | length > 0
  ignore_errors: true
  tags:
    - ws
    - packages_are_installed

# Remove packages

- name: Ensure unnecessary packages are removed @packages_are_removed
  ansible.builtin.apt:
    name: >-
      {{
        var_apt_absent
        | map('regex_replace', '\s*\(.*\)$', '')
        | list
      }}
    state: absent
  when: var_apt_absent | default([]) | length > 0
  ignore_errors: "{{ ansible_check_mode }}"
  tags:
    - bl
    - ws
    - sec
    - mob
    - packages_are_removed
