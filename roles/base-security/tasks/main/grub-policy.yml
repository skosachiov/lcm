- name: Set grub2 password @set_grub2_password
  ignore_errors: "{{ansible_check_mode}}"
  block:
    - name: Set grub2 password Hash focal @set_grub2_password
      blockinfile:
        dest: /etc/grub.d/07_password
        block: |
            cat << EOF
            set superusers="{{var_superusers}}"
            password_pbkdf2 "{{var_superusers}}" "{{var_password_pbkdf2}}"
            EOF
        create: true
      notify: Update grub
    - name: Set grub2 password for Begin @set_grub2_password
      lineinfile:
        dest: /etc/grub.d/10_linux
        line: 'CLASS="--class gnu-linux --class gnu --class os --unrestricted"'
        insertbefore: ^SUPPORTED_INITS=.*
        state: present
        mode: 0700
        create: true
      notify: Update grub
    - name: Set grub2 password for Recovery @set_grub2_password
      lineinfile:
        dest: /etc/grub.d/10_linux
        line: '    CLASS="--class gnu-linux --class gnu --class os"'
        insertafter: if \[ \"x\$\{GRUB_DISABLE_RECOVERY\}\" != \"xtrue\" \]; then
        state: present
        create: true
      notify: Update grub
    - name: Set grub2 password for Recovery end @set_grub2_password
      lineinfile:
        dest: /etc/grub.d/10_linux
        line: '    CLASS="--class gnu-linux --class gnu --class os --unrestricted"'
        insertafter: \"\$\{GRUB_CMDLINE_LINUX_RECOVERY\} \$\{GRUB_CMDLINE_LINUX\}\"
        state: present
        create: true
      notify: Update grub
  when: ansible_pkg_mgr == 'apt'
  tags:
    - bl
    - ws
    - sec
    - mob
    - set_grub2_password

- name: Check superuser and PBKDF2 hash @check_superuser_pbkdf2_grub
  command:
    cmd: >
      grep -Eq 'password_pbkdf2\s+"?{{ var_superusers }}"?\s+"?grub\.pbkdf2\.sha512\.[0-9]+\.[A-Fa-f0-9]+\.[A-Fa-f0-9]+"?'
      /boot/grub/grub.cfg
  register: grub_pw_check
  changed_when: grub_pw_check.rc != 0
  failed_when: false
  when: ansible_pkg_mgr == 'apt'
  tags:
    - bl
    - ws
    - sec
    - mob
    - check_superuser_pbkdf2_grub

- name: Check normal menuentries have unrestricted flag @check_normal_grub_entries
  command:
    cmd: grep -Eq 'menuentry\s+.*--unrestricted' /boot/grub/grub.cfg
  register: grub_unrestricted_check
  changed_when: grub_unrestricted_check.rc != 0
  failed_when: false
  when: ansible_pkg_mgr == 'apt'
  tags:
    - ws
    - sec
    - mob
    - check_normal_grub_entries

- name: Set grub cmdline @set_grub_cmdline
  ignore_errors: "{{ansible_check_mode}}"
  replace:
    dest: /etc/default/grub
    regexp: '(GRUB_CMDLINE_LINUX_DEFAULT=.*quiet net.ifnames=0).*$'
    replace: '\1 audit=1 audit_backlog_limit=8192 splash"'
  notify: Update grub
  when: ansible_pkg_mgr == 'apt'
  tags:
    - ws
    - sec
    - mob
    - set_grub_cmdline

- name: Set grub timeout @set_grub_timeout
  ignore_errors: "{{ansible_check_mode}}"
  replace:
    dest: /etc/default/grub
    regexp: '(GRUB_TIMEOUT).*$'
    replace: '\1=10'
  notify: Update grub
  tags:
    - ws
    - sec
    - mob
    - set_grub_timeout

- name: Set or unset unrestricted OS @set_unset_unrestricted_os
  ignore_errors: "{{ansible_check_mode}}"
  block:
    - name: Find all of the files inside this directory
      find:
        paths: "/etc/grub.d/"
        patterns: "*_os-prober"
      register: result
    - name: Set or unset unrestricted OS Set @set_unset_unrestricted_os
      replace:
        path: "{{item.path}}"
        regexp: '(\-\-class os) \\'
        replace: '\1 --unrestricted \\'
      notify: Update grub
      when: var_unrestricted_os
      with_items: "{{result.files}}"
    - name: Set or unset unrestricted OS Unset @set_unset_unrestricted_os
      replace:
        path: "{{item.path}}"
        regexp: '\-\-unrestricted'
        replace: ''
      notify: Update grub
      when: not var_unrestricted_os
      with_items: "{{result.files}}"
  when: ansible_pkg_mgr == 'apt'
  tags:
    - ws
    - sec
    - mob
    - set_unset_unrestricted_os

- name: Force changed when grub password file older than @grub_password_outdated
  block:
    - name: Find grub password file containing pbkdf2 hash @grub_password_outdated
      ansible.builtin.find:
        paths:
          - /etc/grub.d
        file_type: file
        recurse: true
        contains: '(?i)pbkdf2'
      register: grub_pbkdf2_files

    - name: Stat grub password file @grub_password_outdated
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ grub_pbkdf2_files.files }}"
      register: grub_pw_stat

    - name: Report changed when older @grub_password_outdated
      ansible.builtin.command: "true"
      changed_when: >-
        item.stat.exists
        and item.stat.age > (24 * 60 * 60 * 120)
      loop: "{{ grub_pw_stat.results | default([]) }}"
      notify: Update grub
  when: ansible_pkg_mgr == 'apt'
  tags:
    - bl
    - ws
    - sec
    - mob
    - grub_password_outdated

- name: Ensure kernel cmdline arguments @grub_kernel_args
  block:
    - name: Read GRUB config @grub_kernel_args
      ignore_errors: "{{ansible_check_mode}}"
      slurp:
        src: "{{ var_grub_cmdline_file }}"
      register: grub_raw
      failed_when: false

    - name: Compute managed keys @grub_kernel_args
      ignore_errors: "{{ansible_check_mode}}"
      set_fact:
        grub_managed_keys: >-
          {{ ((var_grub_kernel_args_present | default([]) | map('regex_replace', '=.*$', '') | list)
            + (var_grub_kernel_args_absent  | default([]) | map('regex_replace', '=.*$', '') | list))
            | unique | list }}

    - name: Compute current cmdline @grub_kernel_args
      ignore_errors: "{{ansible_check_mode}}"
      set_fact:
        grub_current: >-
          {{ ((grub_raw.content | default('') | b64decode)
               | regex_findall('(?m)^' ~ var_grub_cmdline_var ~ '="([^"]*)"')
              + [''])[0] }}

    - name: Compute desired cmdline @grub_kernel_args
      ignore_errors: "{{ansible_check_mode}}"
      set_fact:
        grub_new_line: >-
          {% if grub_managed_keys | length == 0 %}
          {{ (grub_current.split() + (var_grub_kernel_args_present | default([]))) | join(' ') }}
          {% else %}
          {{ ((grub_current.split()
               | reject('match',
                        '^(' ~ (grub_managed_keys | map('regex_escape') | join('|')) ~ ')(=|$)')
               | list)
              + (var_grub_kernel_args_present | default([])))
             | join(' ') }}
          {% endif %}

    - name: Apply kernel cmdline arguments @grub_kernel_args
      ignore_errors: "{{ansible_check_mode}}"
      lineinfile:
        path: "{{ var_grub_cmdline_file }}"
        regexp: '^{{ var_grub_cmdline_var }}=".*"$'
        line: '{{ var_grub_cmdline_var }}="{{ grub_new_line }}"'
      when:
        - grub_current is defined
        - grub_new_line is defined
        - grub_current != grub_new_line
      register: grub_updated

    - name: Update GRUB boot config (Debian) @grub_kernel_args
      ignore_errors: "{{ansible_check_mode}}"
      command: update-grub
      when:
        - grub_updated is defined
        - grub_updated is changed
        - ansible_os_family == 'Debian'
      changed_when: true

    - name: Update GRUB boot config (RedHat) @grub_kernel_args
      ignore_errors: "{{ansible_check_mode}}"
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when:
        - grub_updated is defined
        - grub_updated is changed
        - ansible_os_family == 'RedHat'
      changed_when: true
  tags:
    - bl
    - ws
    - sec
    - grub_kernel_args

