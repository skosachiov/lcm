- name: No shell for system accounts @no_shell_for_system_accounts
  ignore_errors: "{{ansible_check_mode}}"
  block:
    - name: No shell for system accounts Get users @no_shell_for_system_accounts
      command: awk -F ':' '($3>0 && $3<1000 && $7!="/usr/sbin/nologin" && $7!="/bin/false" && $7!="/bin/sync" && $7!="") {print $1}' /etc/passwd
      check_mode: no
      register: usernames
      changed_when: false
    - name: No shell for system accounts Set nologin @no_shell_for_system_accounts
      user:
        name: "{{item}}"
        shell: /bin/false
      with_items: "{{usernames.stdout_lines}}"
      when: item != var_ansible_username
  tags:
    - ws
    - sec
    - no_shell_for_system_accounts
