- name: Restrict su to wheel/sudo group @su_restricted_pam_wheel
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*#?\s*auth\s+required\s+pam_wheel\.so(\s+.*)?$'
    line: "auth required pam_wheel.so use_uid {{'group=sudo' if ansible_os_family == 'Debian' else ''}}"
    state: present
  become: true
  tags:
    - bl
    - ws
    - sec
    - mob
    - su_restricted_pam_wheel
