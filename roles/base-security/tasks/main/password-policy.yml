- name: Set pwhistory in pam @conf_pam_pwhistory
  ignore_errors: "{{ansible_check_mode}}"
  lineinfile:
    dest: /etc/pam.d/common-password
    regexp: ^#?\s*password\s*required\s*pam_pwhistory.so
    line: password required pam_pwhistory.so remember=6 retry=3
    state: present
    create: true
  tags:
    - ws
    - sec
    - mob
    - conf_pam_pwhistory

- name: Set Password Minimum Age @accounts_minimum_age_login_defs
  ignore_errors: "{{ansible_check_mode}}"
  lineinfile:
    create: true
    dest: /etc/login.defs
    regexp: ^#?PASS_MIN_DAYS
    line: "PASS_MIN_DAYS {{var_password_min_days}}"
  tags:
    - ws
    - sec
    - mob
    - accounts_minimum_age_login_defs

- name: Set Password Maximum Age @accounts_maximum_age_login_defs
  ignore_errors: "{{ansible_check_mode}}"
  lineinfile:
    create: true
    dest: /etc/login.defs
    regexp: ^#?PASS_MAX_DAYS
    line: "PASS_MAX_DAYS {{var_password_max_days_mob if var_installation_type == 'mobile-device' else var_password_max_days}}"
  when: var_installation_type == "workstation" or var_installation_type == "distribution-point"
  tags:
    - ws
    - sec
    - mob
    - accounts_maximum_age_login_defs

- name: Ensure password expiry warning @accounts_password_warn_age_login_defs
  ignore_errors: "{{ansible_check_mode}}"
  lineinfile:
    create: true
    dest: /etc/login.defs
    regexp: '^#?\s*PASS_WARN_AGE\b'
    line: "PASS_WARN_AGE\t{{ var_password_warn_age }}"
  tags:
    - bl
    - ws
    - sec
    - mob
    - accounts_password_warn_age_login_defs

- name: Set Password Hashing Algorithm in /etc/login.defs @set_password_hashing_algorithm_logindefs
  ignore_errors: "{{ansible_check_mode}}"
  lineinfile:
    dest: /etc/login.defs
    regexp: ^#?ENCRYPT_METHOD
    line: ENCRYPT_METHOD SHA512
    state: present
    create: true
  tags:
    - bl
    - ws
    - sec
    - mob
    - set_password_hashing_algorithm_logindefs

- name: Ensure PAM variables are set accordingly @pam_variables_set
  ignore_errors: "{{ansible_check_mode}}"
  block:
    - name: Ensure PAM variables are set accordingly minlen @pam_variables_set
      lineinfile:
        create: true
        dest: /etc/security/pwquality.conf
        regexp: ^#?\s*minlen
        line: "minlen = {{var_password_minlen}}"
    - name: Ensure PAM variables are set accordingly lcredit @pam_variables_set
      lineinfile:
        create: true
        dest: /etc/security/pwquality.conf
        regexp: ^#?\s*lcredit
        line: lcredit = -1
    - name: Ensure PAM variables are set accordingly dcredit @pam_variables_set
      lineinfile:
        create: true
        dest: /etc/security/pwquality.conf
        regexp: ^#?\s*dcredit
        line: dcredit = -1
    - name: Ensure PAM variables are set accordingly ucredit @pam_variables_set
      lineinfile:
        create: true
        dest: /etc/security/pwquality.conf
        regexp: ^#?\s*ucredit
        line: ucredit = -1
    - name: Ensure PAM variables are set accordingly ocredit @pam_variables_set
      lineinfile:
        create: true
        dest: /etc/security/pwquality.conf
        regexp: ^#?\s*ocredit
        line: ocredit = -1
    - name: Ensure PAM variables are set accordingly difok @pam_variables_set
      lineinfile:
        create: true
        dest: /etc/security/pwquality.conf
        regexp: ^#?\s*difok
        line: difok = 3
  tags:
    - bl
    - ws
    - sec
    - mob
    - pam_variables_set

- name: Set deny configuration of pam_faillock @deny_conf_pam_faillock
  ignore_errors: "{{ansible_check_mode}}"
  block:
    - name: Set deny configuration of pam_faillock Common-auth Stat @deny_conf_pam_faillock
      find:
        paths:
          - /usr/lib64/security
          - /usr/lib/x86_64-linux-gnu/security
        patterns: pam_faillock.so
      register: result
    - name: Set deny configuration of pam_faillock Common-auth Line @deny_conf_pam_faillock
      lineinfile:
        dest: /etc/pam.d/common-auth
        regexp: ^#?\s*auth\s*\[success=ignore default=die\]\s*pam_faillock.so
        line: auth [success=ignore default=die] pam_faillock.so per_user deny=10 unlock_time=300
        state: present
        create: true
      when: result.matched > 0
  tags:
    - ws
    - sec
    - mob
    - deny_conf_pam_faillock

- name: Ensure no pam gnome keyring @ensure_no_pam_gnome_keyring
  ignore_errors: "{{ansible_check_mode}}"
  lineinfile:
    dest: /etc/pam.d/common-auth
    regexp: pam_gnome_keyring.so
    state: absent
  tags:
    - ws
    - sec
    - ensure_no_pam_gnome_keyring

- name: Check password crypt algo @check_password_crypt_algo
  shell: >
    grep -oP '^[^:]+(?=:(?![!:*]|!?\$(6|y)\$)[^:])' /etc/shadow
  register: shadow_bad
  changed_when: shadow_bad.stdout | length > 0
  failed_when: false
  check_mode: false
  become: true
  tags:
    - bl
    - ws
    - sec
    - check_password_crypt_algo

- name: Check maximum password age in /etc/shadow @accounts_maximum_age_login_defs
  shell: |
    awk -F: '
      $2 ~ /^\$/ && ($5 == "" || $5 <= 0 || $5 > {{ var_password_max_days }}) {
        print $1 ":" ($5 == "" ? "unset" : $5)
      }
    ' /etc/shadow
  register: shadow_max_days_noncompliant
  changed_when: shadow_max_days_noncompliant.stdout_lines | length > 0
  check_mode: false
  tags:
    - bl
    - ws
    - sec
    - mob
    - accounts_maximum_age_login_defs

- name: Find accounts with password hash missing warning age in /etc/shadow @accounts_password_warn_age_shadow_check
  shell: |
    awk -F: '
      $2 ~ /^\$/ && ($6 == "" || $6 < {{ var_password_warn_age }}) {
        print $1
      }
    ' /etc/shadow
  register: shadow_warn_age_users
  changed_when: false
  check_mode: false
  tags:
    - bl
    - ws
    - sec
    - mob
    - accounts_password_warn_age_shadow_check

- name: Check for empty local passwords in /etc/shadow with exceptions @no_empty_passwords
  shell: |
    awk -F: '
      BEGIN {
        split("{{ var_empty_password_exceptions | join(' ') }}", list, " ")
        for (i in list) allow[list[i]] = 1
      }
      $2 == "" && !($1 in allow) { print $1 }
    ' /etc/shadow
  register: empty_password_accounts
  changed_when: false
  check_mode: false
  failed_when: empty_password_accounts.stdout_lines | length > 0
  tags:
    - bl
    - ws
    - sec
    - mob
    - no_empty_passwords