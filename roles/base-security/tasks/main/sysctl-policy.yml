- name: Ensure sysctl hardening is set @sysctl_hardening
  ignore_errors: "{{ansible_check_mode}}"
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    ignoreerrors: true
    sysctl_file: "{{ var_sysctl_file }}"
  loop: "{{ var_sysctl_hardening | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  tags:
    - bl
    - ws
    - sec
    - mob
    - sysctl_hardening

- name: Read currently managed sysctl file @sysctl_hardening_cleanup_slurp
  ignore_errors: "{{ansible_check_mode}}"
  slurp:
    src: "{{ var_sysctl_file }}"
  register: var_sysctl_file_raw
  failed_when: false
  tags:
    - bl
    - ws
    - sec
    - mob  
    - sysctl_hardening_cleanup_slurp

- name: Compute stale sysctl entries @sysctl_hardening_cleanup_set
  ignore_errors: "{{ansible_check_mode}}"
  set_fact:
    var_sysctl_stale: >-
      {{ ((var_sysctl_file_raw.content | default('') | b64decode)
           | regex_findall('(?m)^\s*([A-Za-z0-9_.\-]+)\s*=')
           | map('trim') | unique | list)
         | difference(var_sysctl_hardening.keys() | list) }}
  tags:
    - bl
    - ws
    - sec
    - mob  
    - sysctl_hardening_cleanup_set

- name: Remove sysctl entries no longer in the list @sysctl_hardening_cleanup
  ignore_errors: "{{ansible_check_mode}}"
  sysctl:
    name: "{{ item }}"
    state: absent
    reload: true
    sysctl_file: "{{ var_sysctl_file }}"
  loop: "{{ var_sysctl_stale }}"
  tags:
    - bl
    - ws
    - sec
    - mob  
    - sysctl_hardening_cleanup
