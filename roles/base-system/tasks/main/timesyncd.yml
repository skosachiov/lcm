- name: Enable service systemd-timesyncd @service_systemd_timesyncd_enabled
  ignore_errors: "{{ ansible_check_mode }}"
  block:
    - name: Ensure ntp and chrony are removed @service_systemd_timesyncd_enabled
      ansible.builtin.package:
        name:
          - ntp
          - chrony
        state: absent
      failed_when: false

    - name: Ensure systemd-timesyncd is installed @service_systemd_timesyncd_enabled
      ansible.builtin.package:
        name: systemd-timesyncd
        state: present
      failed_when: false

    - name: Gather package facts @service_systemd_timesyncd_enabled
      ansible.builtin.package_facts:
        manager: auto

    - name: Enable and start systemd-timesyncd @service_systemd_timesyncd_enabled
      ansible.builtin.systemd:
        name: systemd-timesyncd
        enabled: true
        state: started
        masked: false
      failed_when: false
      when: '"systemd-timesyncd" in ansible_facts.packages'
  tags:
    - bl
    - ws
    - sec
    - mob
    - service_systemd_timesyncd_enabled

- name: Systemd-timesyncd set internal pool @systemd_timesyncd_set_internal_pool
  ignore_errors: "{{ ansible_check_mode }}"
  block:
    - name: Ensure [Time] section exists @systemd_timesyncd_set_internal_pool
      ansible.builtin.lineinfile:
        path: /etc/systemd/timesyncd.conf
        regexp: '^\[Time\]'
        line: '[Time]'
        create: true
        mode: '0644'

    - name: Systemd-timesyncd server set @systemd_timesyncd_set_internal_pool
      ansible.builtin.lineinfile:
        path: /etc/systemd/timesyncd.conf
        regexp: '^#?\s*NTP\s*='
        line: "NTP={{ var_kdc.split(',')[0] }}"
        insertafter: '^\[Time\]'
      notify: Restart systemd-timesyncd

    - name: Systemd-timesyncd disable fallback servers @systemd_timesyncd_set_internal_pool
      ansible.builtin.lineinfile:
        path: /etc/systemd/timesyncd.conf
        regexp: '^#?\s*FallbackNTP\s*='
        line: "FallbackNTP="
        insertafter: '^\[Time\]'
      notify: Restart systemd-timesyncd
  when:
    - var_installation_type == "workstation"
    - var_internal_ansible_ip | default(false) | bool
  tags:
    - bl
    - ws
    - sec
    - mob
    - systemd_timesyncd_set_internal_pool

- name: Systemd-timesyncd tracking @service_systemd_timesyncd_tracking
  block:
    - name: Systemd-timesyncd tracking @service_systemd_timesyncd_tracking
      shell: 'timedatectl show-timesync --property=Leap | grep "Leap=normal"'
      register: items
      changed_when: items.stdout_lines|length != 1
      failed_when: false
  tags:
    - ws
    - sec
    - mob
    - service_systemd_timesyncd_tracking

- name: Ensure permission 0644 on systemd-timesyncd config @file_0644_timesyncd_conf
  ignore_errors: "{{ansible_check_mode}}"
  block:
    - name: Ensure permission 0644 on /etc/systemd/timesyncd.conf @file_0644_timesyncd_conf
      file:
        path: /etc/systemd/timesyncd.conf
        mode: u-x,go-wx
        owner: root
        group: root
      failed_when: false
    - name: Find timesyncd drop-in configs @file_0644_timesyncd_conf
      find:
        paths: /etc/systemd/timesyncd.conf.d
        file_type: file
        recurse: true
      register: result
      failed_when: false
    - name: Ensure permission 0644 on timesyncd drop-in configs @file_0644_timesyncd_conf
      file:
        path: "{{item.path}}"
        mode: u-x,go-wx
        owner: root
        group: root
      with_items: "{{result.files | default([])}}"
  tags:
    - ws
    - sec
    - mob
    - file_0644_timesyncd_conf
    