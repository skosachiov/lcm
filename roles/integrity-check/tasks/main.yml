
- name: Ensure aide is active @aide_is_active
  ignore_errors: "{{ ansible_check_mode }}"
  block:
    - name: Ensure aide is installed @aide_is_active
      ansible.builtin.package:
        name: aide
        state: present
    - name: Set AIDE configuration path @aide_is_active
      ansible.builtin.set_fact:
        _aide_config: >-
          {{
            '/etc/aide/aide.conf'
            if ansible_facts['os_family'] == 'Debian'
            else '/etc/aide.conf'
          }}
    - name: Check AIDE configuration @aide_is_active
      ansible.builtin.stat:
        path: "{{ _aide_config }}"
      register: _aide_config_stat
    - name: Ensure AIDE reports to syslog @aide_is_active
      ansible.builtin.lineinfile:
        path: "{{ _aide_config }}"
        regexp: '^\s*#?\s*report_url\s*='
        line: "report_url=syslog:LOG_INFO"
        state: present
      when: _aide_config_stat.stat.exists | default(false)
    - name: Check AIDE database files @aide_is_active
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/aide/aide.db
        - /var/lib/aide/aide.db.gz
      register: _aide_database_stats
    - name: Collect AIDE database timestamps @aide_is_active
      ansible.builtin.set_fact:
        _aide_database_mtimes: >-
          {{
            _aide_database_stats.results
            | selectattr('stat.exists', 'equalto', true)
            | map(attribute='stat.mtime')
            | list
          }}
    - name: Warn if AIDE database is missing @aide_is_active
      ansible.builtin.debug:
        msg: "WARNING: AIDE database does not exist"
      when: _aide_database_mtimes | length == 0
    - name: Warn if AIDE database is outdated @aide_is_active
      ansible.builtin.debug:
        msg: "WARNING: AIDE database is older than 48 hours"
      when:
        - _aide_database_mtimes | length > 0
        - >-
          (_aide_database_mtimes | max | float) <
          (ansible_facts['date_time']['epoch'] | int - 172800)
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  tags:
    - ws
    - sec
    - mob
    - aide_is_active

- name: Aide config file section @aide_config_file_section
  ignore_errors: "{{ansible_check_mode}}"
  blockinfile:
    create: true
    dest: /etc/aide/aide.conf.d/99_aide_myrule
    block: |
      /temp R
  when: ansible_os_family in ["Debian", "RedHat"]
  tags:
    - ws
    - sec
    - mob
    - aide_config_file_section


