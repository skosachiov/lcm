# Container detection

- name: Get default IPv4 address @default
  ansible.builtin.set_fact:
    _host_ipv4: >-
      {{
        (ansible_facts | default({}))
        .get('default_ipv4', {})
        .get('address', '')
        | default('', true)
      }}
  tags: always

- name: Detect container and set dummy IPv4 @default
  when: _host_ipv4 | length == 0
  block:
    - name: Check container markers @default
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /.dockerenv
        - /run/.containerenv
      register: _ctr_markers

    - name: Set dummy IPv4 for container @default
      ansible.builtin.set_fact:
        _host_ipv4: "127.0.0.1"
      when: >-
        _ctr_markers.results
        | selectattr('stat', 'defined')
        | selectattr('stat.exists', 'equalto', true)
        | list
        | length > 0
  tags: always

- name: Verify IPv4 address @default
  ansible.builtin.assert:
    that:
      - _host_ipv4 | length > 0
    fail_msg: "Could not determine default IPv4 address"
  tags: always

- name: Print default private IPv4 address @default
  ansible.builtin.debug:
    msg: "Private IP: {{ _host_ipv4 }}"
  tags: always

# Discover subnet configurations

- name: Find subnet var files @default
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/inventories/subnets"
    patterns: "main.yml"
    file_type: file
    recurse: true
  register: _subnet_files
  delegate_to: localhost
  run_once: true
  tags: always

- name: Initialize subnet map @default
  ansible.builtin.set_fact:
    var_subnets_by_name: {}
  run_once: true
  tags: always

- name: Build subnet map @default
  ansible.builtin.set_fact:
    var_subnets_by_name: >-
      {{
        var_subnets_by_name | combine({
          (item.path | dirname | dirname | basename):
          (
            (lookup('ansible.builtin.file', item.path)
            | from_yaml
            | default({}, true))
            .get('var_subnets', [])
          )
        })
      }}
  loop: "{{ _subnet_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: (item.path | dirname | basename) == 'vars'
  run_once: true
  tags: always

- name: Verify subnet configurations @default
  ansible.builtin.assert:
    that:
      - var_subnets_by_name | length > 0
    fail_msg: "No subnet configurations found in inventories/subnets"
  run_once: true
  tags: always

# Match subnet by IPv4

- name: Initialize subnet matches @default
  ansible.builtin.set_fact:
    _matched_subnets: []
  tags: always

- name: Find matching subnet @default
  ansible.builtin.set_fact:
    _matched_subnets: "{{ _matched_subnets + [item.0.key] }}"
  loop: "{{ var_subnets_by_name | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }}: {{ item.1 }}"
  when: _host_ipv4 is ansible.utils.in_network(item.1)
  tags: always

- name: Verify unique subnet match @default
  ansible.builtin.assert:
    that:
      - (_matched_subnets | unique | list | length) == 1
    fail_msg: >-
      Expected exactly one subnet for IP {{ _host_ipv4 }}.
      Matches: {{ _matched_subnets | unique | list }}
  tags: always

- name: Set subnet name @default
  ansible.builtin.set_fact:
    var_subnet: "{{ _matched_subnets | unique | first }}"
  tags: always

- name: Print detected subnet @default
  ansible.builtin.debug:
    msg: "Detected subnet: {{ var_subnet }} (IP: {{ _host_ipv4 }})"
  tags: always

# Include vars

- name: Include all vars @default
  include_vars:
    dir: "{{playbook_dir}}/inventories/all/vars"
  tags: always

- name: Include subnet vars @default
  include_vars:
    file: "{{playbook_dir}}/inventories/subnets/{{var_subnet}}/vars/main.yml"
  tags: always

# Get time starttransfer

- name: Get curl time starttransfer @default
  tags: always
  block:
    - name: Get curl time starttransfer Shell @default
      ansible.builtin.command:
        argv: [curl, -sS, -o, /dev/null, -w, "%{time_starttransfer}", --max-time, "10", "https://{{ var_ansible_fqdn }}"]
      environment: { LANG: C.UTF-8 }
      register: result
      changed_when: false
      failed_when: false
    - name: Get curl time starttransfer Set @default
      ansible.builtin.set_fact:
        var_time_starttransfer: >-
          {{ 9.999999 if (result.rc | default(0) | int) != 0
             or (result.stdout | default('', true) | trim) is not match('^[0-9]+([.][0-9]+)?$')
             or (result.stdout | default('', true) | trim | float) == 0.0
             else (result.stdout | trim | float) }}
    - name: Fail on curl error @default
      ansible.builtin.fail:
        msg: "curl failed for https://{{ var_ansible_fqdn }} (rc={{ result.rc | default('?') }}): {{ result.stderr | default('') | trim or 'no stderr' }}"
      when: (result.rc | default(0) | int) != 0
  rescue:
    - name: Get curl time starttransfer Rescue @default
      ansible.builtin.set_fact:
        var_time_starttransfer: 0.100000

# Do not continue if server load is high

- name: Do not continue if server load is high @default
  failed_when: true
  command: 'logger "do not continue if server load is high"'
  when: var_time_starttransfer|float > 2.500000
  tags: always

# Get ou

- name: Get ou @default
  block:
    - name: Get ou Sssd status @default
      changed_when: false
      ansible.builtin.shell: yes no | LANG=C.UTF8 /usr/sbin/sssctl domain-status {{ var_local_domain }}
      register: sssctl_status
      failed_when: false

    - name: Get ou Kinit @default
      changed_when: false
      ansible.builtin.command:
        argv: [kinit, -kt, /etc/krb5.keytab, "{{ ansible_facts.nodename.split('.')[0] | upper }}$@{{ var_default_realm }}"]
      failed_when: false

    - name: Get ou AD global catalog
      changed_when: false
      ansible.builtin.shell: >-
        yes no | LANG=C.UTF8 /usr/sbin/sssctl domain-status {{ var_local_domain }}
        | grep 'AD Global Catalog:' | awk '{print $4}'
      register: global_ad_catalog
      failed_when: false

    - name: Assert AD global catalog found @default
      ansible.builtin.assert:
        that:
          - global_ad_catalog.stdout_lines | default([]) | length > 0
          - global_ad_catalog.stdout_lines[0] | default('') | length > 0
        fail_msg: >-
          Could not find 'AD Global Catalog:' for {{ var_local_domain }}.
          rc={{ global_ad_catalog.rc | default('?') }}
          stdout={{ global_ad_catalog.stdout | default('') | to_json }}
        quiet: true

    - name: Get ou Ldapsearch ou @default
      changed_when: false
      ansible.builtin.shell: >-
        ldapsearch -o ldif-wrap=no -LLL -Y GSSAPI
        -H ldap://{{ global_ad_catalog.stdout_lines[0] | trim }}
        -b "dc={{ var_local_domain.split('.')[0] }},dc={{ var_local_domain.split('.')[1] }}"
        "(&(objectClass=computer)(name={{ ansible_facts.nodename.split('.')[0] }}))" dn
        | grep -i '^dn:'
        | perl -MMIME::Base64 -n -00 -e 's/\n +//g;s/(?<=:: )(\S+)/decode_base64($1)/eg;print'
        | sed -e 's/^dn:[[:space:]]*//' -e 's/(/\\(/g' -e 's/)/\\)/g'
      register: ldap_search_ou_dn
      failed_when: false

    - name: Assert OU DN found @default
      ansible.builtin.assert:
        that:
          - ldap_search_ou_dn.stdout_lines | default([]) | length > 0
          - ldap_search_ou_dn.stdout_lines[0] | default('') | length > 0
        fail_msg: >-
          Could not find DN for computer {{ ansible_facts.nodename }}.
          rc={{ ldap_search_ou_dn.rc | default('?') }}
          stdout={{ ldap_search_ou_dn.stdout | default('') | to_json }}
          stderr={{ ldap_search_ou_dn.stderr | default('') | to_json }}
        quiet: true

    - name: Get ou Ldap_search giud @default
      changed_when: false
      ansible.builtin.shell: >-
        ldapsearch -o ldif-wrap=no -LLL -Y GSSAPI
        -H ldap://{{ global_ad_catalog.stdout_lines[0] | trim }}
        -b "dc={{ var_local_domain.split('.')[0] }},dc={{ var_local_domain.split('.')[1] }}"
        "(&(objectClass=organizationalUnit)(distinguishedName={{ ldap_search_ou_dn.stdout_lines[0] | trim }}))" objectGUID
        | grep -i '^objectGUID' | head -n1
      register: ldap_search_ou_guid
      failed_when: false

    - name: Assert objectGUID found @default
      ansible.builtin.assert:
        that:
          - ldap_search_ou_guid.stdout_lines | default([]) | length > 0
          - "'::' in (ldap_search_ou_guid.stdout_lines[0] | default(''))"
          - (ldap_search_ou_guid.stdout_lines[0].split('::', 1)[1] | trim) | length > 0
        fail_msg: >-
          Could not find objectGUID for OU {{ ldap_search_ou_dn.stdout_lines[0] | default('?') }}.
          rc={{ ldap_search_ou_guid.rc | default('?') }}
          stdout={{ ldap_search_ou_guid.stdout | default('') | to_json }}
          stderr={{ ldap_search_ou_guid.stderr | default('') | to_json }}
        quiet: true

    - name: Get ou Python uuid @default
      changed_when: false
      ansible.builtin.command: /usr/bin/python3
      args:
        stdin: |
          import base64, uuid
          b64 = "{{ ldap_search_ou_guid.stdout_lines[0].split('::', 1)[1] | trim }}"
          print(str(uuid.UUID(bytes_le=base64.b64decode(b64))))
      register: python_ou_guid
      failed_when: false

    - name: Assert UUID parsed @default
      ansible.builtin.assert:
        that:
          - python_ou_guid.rc | default(1) | int == 0
          - python_ou_guid.stdout_lines | default([]) | length > 0
          - python_ou_guid.stdout_lines[0] | default('') | length > 0
        fail_msg: >-
          Could not decode objectGUID from {{ ldap_search_ou_guid.stdout_lines[0] | default('?') }}.
          rc={{ python_ou_guid.rc | default('?') }}
          stderr={{ python_ou_guid.stderr | default('') | to_json }}
        quiet: true

    - name: Get ou Set fact @default
      ansible.builtin.set_fact:
        var_ou_dn: "{{ ldap_search_ou_dn.stdout_lines[0] | trim }}"
        var_ou_guid: "{{ python_ou_guid.stdout_lines[0] | trim }}"
  rescue:
    - name: Get ou Failed to get ou @default
      ansible.builtin.debug:
        msg: >-
          Failed to get OU for {{ ansible_facts.nodename }} ({{ var_installation_type }}).
          Continuing without var_ou_dn / var_ou_guid.
  when: var_installation_type == 'workstation'
  tags: always

- name: Include ou vars @default
  block:
    - name: Include ou vars Try @default
      include_vars:
        file: "{{playbook_dir}}/inventories/ou/{{var_ou_guid}}/vars/main.yml"
  rescue:
    - name: Include ou vars Failed @default
      debug:
        msg: "Failed to get ou inventory folder"
  when: var_ou_guid is defined
  tags: always

- name: Include distribution vars @default
  include_vars:
    file: "{{playbook_dir}}/inventories/distribution/{{ansible_distribution}}/{{ansible_distribution_major_version}}/vars/main.yml"
  tags: always

- name: Include branch vars @default
  failed_when: false
  include_vars:
    file: "{{playbook_dir}}/inventories/branches/{{var_company|lower}}/vars/main.yml"
  when: var_company | default('') | length > 0
  tags: always

- name: Include subnet vars @default
  include_vars:
    file: "{{playbook_dir}}/inventories/subnets/{{var_subnet}}/vars/main.yml"
  when: var_subnet | default('') | length > 0
  tags: always

- name: Include domain vars @default
  include_vars:
    file: "{{playbook_dir}}/inventories/domains/{{var_local_domain|lower}}/vars/main.yml"
  failed_when: false
  when: var_local_domain | default('') | length > 0
  tags: always

- name: Include env vars @default
  include_vars:
    file: "{{playbook_dir}}/inventories/env/{{var_environment}}/vars/main.yml"
  failed_when: false
  when: var_environment | default('') | length > 0
  tags: always

- name: Include device vars @default
  include_vars:
    file: "{{playbook_dir}}/inventories/devices/{{var_device}}/vars/main.yml"
  failed_when: false
  when: var_device | default('') | length > 0
  tags: always

# Check Intranet/Internet environment

- name: Get ansible server IP @default
  block:
    - name: Get ansible server IP @default
      wait_for:
        port: 443
        host: "{{var_ansible_fqdn}}"
        timeout: 5
      register: result
      ignore_errors: true
      changed_when: false
    - name: Get ansible server IP @default
      set_fact:
        var_internal_ansible_ip: "{{not result.failed}}"
  tags: always

- name: Get external ansible server IP @default
  block:
    - name: Get external ansible server IP @default
      wait_for:
        port: 443
        host: "{{var_external_ansible_fqdn}}"
        timeout: 5
      register: result
      ignore_errors: true
      changed_when: false
    - name: Get external ansible server IP @default
      set_fact:
        var_external_ansible_ip: "{{not result.failed}}"
  tags: always

- name: Include profile vars @default
  include_vars:
    dir: "{{playbook_dir}}/inventories/profiles/{{var_profile}}/vars"
  tags: always

# Copy server cert

- name: Copy server certs @default
  copy:
    src: "{{item}}"
    dest: /usr/local/share/ca-certificates/
    mode: go+r
  with_fileglob:
    - "{{playbook_dir}}/{{var_certs_dir}}/https-cert.crt"
  tags: always

- name: Copy ca certs and script Update @default
  command: "{{'update-ca-certificates' if ansible_pkg_mgr == 'apt' else 'update-ca-trust'}}"
  changed_when: false
  tags: always

- name: Copy skip check cert conf @include_tasks
  copy:
    src: "{{playbook_dir}}/roles/pre-tasks/files/nocheckcert.conf"
    dest: /etc/apt/apt.conf.d/nocheckcert.conf
  when: ansible_pkg_mgr == 'apt'
  tags: always

# Check grub nondefault

- name: Grub efi reinstall Check grub default @default
  check_mode: true
  lineinfile:
    path: /etc/default/grub
    regexp: ^GRUB_DEFAULT=[^0]
    state: absent
  register: grub_nondefault
  tags: always

# Build merged APT package lists

- name: Build merged APT package lists @default
  tags: always
  block:
    - name: Define APT inventory levels @default
      ansible.builtin.set_fact:
        _apt_levels:
          - name: all
            paths: ['all']
          - name: branches
            paths: "{{ ['branches/' ~ (var_company | lower)] if var_company | default('') | length > 0 else [] }}"
          - name: domains
            paths: "{{ ['domains/' ~ (var_local_domain | lower)] if var_local_domain | default('') | length > 0 else [] }}"
          - name: subnets
            paths: "{{ ['subnets/' ~ var_subnet] if var_subnet | default('') | length > 0 else [] }}"
          - name: env
            paths: "{{ ['env/' ~ var_environment] if var_environment | default('') | length > 0 else [] }}"
          - name: devices
            paths: "{{ ['devices/' ~ var_device] if var_device | default('') | length > 0 else [] }}"
          - name: profiles
            paths: "{{ ['profiles/' ~ var_profile] if var_profile | default('') | length > 0 else [] }}"
          - name: distribution
            paths: "distribution/{{ ansible_facts['distribution'] }}/{{ ansible_facts['distribution_major_version'] }}"

    - name: Generate ordered APT rule sources @default
      ansible.builtin.set_fact:
        _apt_sources: >-
          {%- set ns = namespace(sources=[]) -%}
          {%- for level in _apt_levels -%}
            {%- for state in ['present', 'absent'] -%}
              {%- for path in level.paths | unique -%}
                {%- set _ = ns.sources.append({'level': level.name, 'path': path, 'state': state}) -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ ns.sources }}

    - name: Collect APT entries per state @default
      ansible.builtin.set_fact:
        _apt_present_entries: "{{ _apt_present_entries | default([]) + _entries }}"
        _apt_absent_entries: "{{ _apt_absent_entries | default([]) + _entries }}"
      vars:
        _apt_file: "{{ playbook_dir }}/inventories/{{ item.path }}/files/apt/{{ item.state }}.list"
        _entries: >-
          {{
            lookup('ansible.builtin.file', _apt_file).splitlines()
            | map('regex_replace', '#.*$', '')
            | map('trim')
            | reject('equalto', '')
            | list
          }}
      loop: "{{ _apt_sources }}"
      loop_control:
        label: "{{ item.level }}: {{ item.path }}/{{ item.state }}.list"
      when: query('ansible.builtin.fileglob', _apt_file) | length > 0

    - name: Export final APT package lists @default
      ansible.builtin.set_fact:
        var_apt_present: "{{ (_apt_present_entries | default([])) | unique | sort }}"
        var_apt_absent: "{{ (_apt_absent_entries | default([])) | unique | sort }}"

    - name: Print merged APT package summary @default
      ansible.builtin.debug:
        msg:
          levels: "{{ _apt_levels }}"
          present_count: "{{ var_apt_present | length }}"
          absent_count: "{{ var_apt_absent | length }}"
          present: "{{ var_apt_present }}"
          absent: "{{ var_apt_absent }}"